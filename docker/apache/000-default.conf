# Sitio de Apache para Laravel: solo se publica la carpeta public/.
<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        # Permite el .htaccess de Laravel (rutas amigables con mod_rewrite).
        AllowOverride All
        Require all granted
    </Directory>

    # En la imagen oficial estos ficheros apuntan a la salida estándar del contenedor.
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
